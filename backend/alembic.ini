# Alembic configuration for Cognate AI backend
# This file is used by 'alembic' CLI and must remain in backend/

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# sys.path adjustments — add backend/ to path so 'app' is importable
prepend_sys_path = .

# Truncate long messages in revision files
truncate_slug_length = 40

# None means the source_url is taken from sqlalchemy.url in this file.
# We override this in env.py using settings.database_url.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
