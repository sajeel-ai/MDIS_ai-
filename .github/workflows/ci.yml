name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cognate_ai
          POSTGRES_USER: cognate
          POSTGRES_PASSWORD: cognate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognate -d cognate_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      AUTH_DISABLED: "false"
      DATABASE_URL: postgresql+asyncpg://cognate:cognate@localhost:5432/cognate_ai
      STORAGE_LOCAL_PATH: ${{ runner.temp }}/cognate-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install OCR system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Evaluate synthetic extraction fixtures
        working-directory: backend
        run: python -m app.evals.run_eval --check-baseline
      - name: Download official HL7 FHIR validator
        run: curl --fail --location --output validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.9.12/validator_cli.jar
      - name: Validate synthetic FHIR R4 bundles
        working-directory: backend
        run: python scripts/validate_fhir_fixtures.py --validator ../validator_cli.jar
