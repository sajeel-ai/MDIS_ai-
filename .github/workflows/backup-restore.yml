name: Nightly backup restore verification

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  restore-test:
    runs-on: ubuntu-latest
    if: ${{ secrets.BACKUP_AGE_IDENTITY != '' && secrets.BACKUP_URL != '' }}
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5433/cognate_ai_test
      BACKUP_AGE_IDENTITY_FILE: ${{ runner.temp }}/backup-age-identity
      STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL client and age
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client age
      - name: Start disposable PostgreSQL
        run: |
          docker run --detach --name cognate-restore-db \
            --env POSTGRES_DB=cognate_ai_test \
            --env POSTGRES_USER=test \
            --env POSTGRES_PASSWORD=test \
            --publish 5433:5433 postgres:16.4 \
            postgres -p 5433
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5433 -U test -d cognate_ai_test && break; sleep 2; done
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Prepare backup identity
        run: printf '%s\n' '${{ secrets.BACKUP_AGE_IDENTITY }}' > "$BACKUP_AGE_IDENTITY_FILE"
      - name: Download latest encrypted backup
        run: curl --fail --location --output latest.dump.age "$BACKUP_URL"
      - name: Restore and verify
        shell: pwsh
        run: ./scripts/restore-test.ps1 -BackupFile ./latest.dump.age -StorageKey "${{ secrets.RESTORE_SAMPLE_STORAGE_KEY }}"
