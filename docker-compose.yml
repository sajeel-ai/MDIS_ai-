# Cognate AI — Docker Compose (Phase 2)
#
# D2 topology: PostgreSQL + FastAPI backend only.
# Frontend Vite dev server runs separately: pnpm dev
#
# Services added in later phases:
#   - pgAdmin (if needed for DB inspection)
#   - Redis + Celery workers (D9, async processing)
#   - MinIO (D9, S3-compatible file storage)

name: cognate-ai

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: cognate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cognate_ai}
      POSTGRES_USER: ${POSTGRES_USER:-cognate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository root .env}
    volumes:
      - cognate_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognate} -d ${POSTGRES_DB:-cognate_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognate-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      # Override DB host to use the Docker service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cognate}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository root .env}@postgres:5432/${POSTGRES_DB:-cognate_ai}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8443"
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: Cognate AI <no-reply@localhost>
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      PUBLIC_APP_URL: http://localhost:8443
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Local-only SMTP capture. Messages are not delivered to real recipients.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cognate-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Optional local HAPI FHIR R4 test server. Not started by default.
  fhir:
    image: hapiproject/hapi:latest
    profiles: ["fhir"]
    container_name: cognate-fhir
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - cognate_fhir_data:/data/hapi

volumes:
  cognate_postgres_data:
    driver: local
  cognate_fhir_data:
    driver: local
