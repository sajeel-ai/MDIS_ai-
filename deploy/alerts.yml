groups:
  - name: cognate-ai
    rules:
      - alert: CognateQueueStuck
        expr: queue_oldest_job_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Processing queue has a stuck job
      - alert: CognateDeadLetterJobs
        expr: dead_letter_jobs > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Processing jobs are in dead-letter state
      - alert: CognateHighRequestErrorRate
        expr: rate(http_request_errors_total[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API error rate is elevated
      - alert: CognateDatabaseOrStorageErrors
        expr: rate(database_errors_total[5m]) + rate(storage_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Database or storage errors detected
      - alert: CognateAuditWriteFailures
        expr: rate(audit_write_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Audit event writes are failing
      - alert: CognateBackupAge
        expr: backup_age_seconds > 86400
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Latest database backup is too old
